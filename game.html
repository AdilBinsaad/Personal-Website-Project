<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>

  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<header>
  <h1>
    <a href="index.html" class="logo">Adil's World</a>
  </h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="cv.html">CV</a>
    <a href="game.html" class="active">Game</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="game-container">

  <!-- 🎮 ฝั่งเกม -->
  <div class="game-area">

    <div class="game-title">Snake Game</div>
    
    <!-- Difficulty -->
    <div class="difficulty">
      <label>Difficulty Level :</label>
      <select id="level">
        <option value="150">Easy</option>
        <option value="100" selected>Medium</option>
        <option value="60">Hard</option>
      </select>
    </div>

    <h2 class="score">Score: <span id="score">0</span></h2>

    <!-- เกม -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>

  </div>

  <section class="rules">
    <h3>📜 Game Rules</h3>

    <ul>
    
      <p>Players control a snake to eat food, earning points and growing longer. The game ends if the snake hits the wall or itself, so careful movement is key to getting a high score.</p>
      
    </ul>

  </section>

</main>

<!-- Popup -->
<div id="gameOverPopup" class="popup hidden">
  <div class="popup-content">
    <h2>Game Over</h2>
    <p>Your Score: <span id="finalScore"></span></p>
    <button onclick="restartGame()">Play Again</button>
  </div>
</div>

<noscript>
  <p>กรุณาเปิด JavaScript เพื่อเล่นเกม</p>
</noscript>

<footer>
  <p>© 2026 Adil's world</p>
</footer>

<script src="js/game.js"></script>

</body>
</html>
